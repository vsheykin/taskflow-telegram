name: Send Task Reminders

on:
  schedule:
    - cron: '*/5 * * * *'  # Каждые 5 минут
  workflow_dispatch:  # Ручной запуск

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret
        run: |
          if [ -z "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]; then
            echo "❌ Secret SUPABASE_SERVICE_ROLE_KEY is empty!"
            exit 1
          else
            echo "✅ Secret exists (length: ${#SUPABASE_SERVICE_ROLE_KEY})"
          fi
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Call Supabase Edge Function
        run: |
          curl -v -X POST https://fgyyzyruhwdbvzvtojoy.supabase.co/functions/v1/send-reminders \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json"
