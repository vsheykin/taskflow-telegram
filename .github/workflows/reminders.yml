name: Send Task Reminders (Backup)

# Этот workflow больше не нужен для напоминаний!
# Напоминания теперь отправляются прямо из приложения при открытии.
# Оставлен как резервный вариант для ручной отправки.

on:
  workflow_dispatch:  # Только ручной запуск
  schedule:
    - cron: '0 */6 * * *'  # Раз в 6 часов (для подстраховки)

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        run: |
          if [ -z "${{ secrets.VITE_SUPABASE_URL }}" ]; then
            echo "❌ Secret VITE_SUPABASE_URL is empty!"
            exit 1
          fi
          if [ -z "${{ secrets.VITE_SUPABASE_ANON_KEY }}" ]; then
            echo "❌ Secret VITE_SUPABASE_ANON_KEY is empty!"
            exit 1
          fi
          if [ -z "${{ secrets.VITE_TELEGRAM_BOT_TOKEN }}" ]; then
            echo "❌ Secret VITE_TELEGRAM_BOT_TOKEN is empty!"
            exit 1
          fi
          echo "✅ All secrets are set"

      - name: Send reminders via Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.VITE_TELEGRAM_BOT_TOKEN }}
        run: |
          echo "🔔 Получаем задачи с просроченными напоминаниями..."
          
          # Получаем задачи с просроченными напоминаниями
          RESPONSE=$(curl -s -X GET \
            "${SUPABASE_URL}/rest/v1/tasks?select=*&reminder_date=lte.$(date -u +%Y-%m-%dT%H:%M:%S)&reminder_sent=eq.false&status=in.(new,in_progress)" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          
          echo "📋 Ответ: $RESPONSE"
          
          # Проверяем, есть ли задачи
          if [ "$RESPONSE" = "[]" ] || [ -z "$RESPONSE" ]; then
            echo "ℹ️ Нет задач для напоминания"
            exit 0
          fi
          
          # Отправляем уведомления через jq для правильного JSON
          echo "$RESPONSE" | jq -c '.[]' | while read -r task; do
            TASK_ID=$(echo "$task" | jq -r '.id')
            TITLE=$(echo "$task" | jq -r '.title')
            USER_ID=$(echo "$task" | jq -r '.user_id')
            DESCRIPTION=$(echo "$task" | jq -r '.description // empty')
            
            echo "📤 Отправляю напоминание для задачи: $TITLE (user: $USER_ID)"
            
            # Формируем сообщение через jq для правильного JSON с переносами строк
            if [ -n "$DESCRIPTION" ]; then
              MESSAGE=$(jq -n --arg title "$TITLE" --arg desc "$DESCRIPTION" \
                "🔔 <b>Напоминание о задаче</b>\n\n📝 <b>\($title)</b>\n\n\($desc)")
            else
              MESSAGE=$(jq -n --arg title "$TITLE" \
                "🔔 <b>Напоминание о задаче</b>\n\n📝 <b>\($title)</b>")
            fi
            
            # Отправляем в Telegram
            TG_RESPONSE=$(curl -s -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg chat_id "$USER_ID" --arg text "$MESSAGE" \
                '{chat_id: $chat_id, text: $text, parse_mode: "HTML"}')")
            
            echo "📬 Telegram ответ: $TG_RESPONSE"
            
            # Обновляем счётчик напоминаний
            CURRENT_COUNT=$(echo "$task" | jq -r '.reminder_count // 0')
            NEW_COUNT=$((CURRENT_COUNT + 1))
            
            curl -s -X PATCH \
              "${SUPABASE_URL}/rest/v1/tasks?id=eq.${TASK_ID}" \
              -H "apikey: ${SUPABASE_ANON_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
              -H "Content-Type: application/json" \
              -H "Prefer: return=minimal" \
              -d "{\"reminder_count\": ${NEW_COUNT}, \"last_reminder_sent_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"
            
            echo "✅ Задача ${TASK_ID} обновлена (reminder_count: ${NEW_COUNT})"
          done
          
          echo "🎉 Готово!"
